<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cyber Timer Ritual</title>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/b8e20323f8f36e06f87745c93c45afcd?family=Industry+W00+Bold" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="clock-mode">

  <div class="screen">
    <div id="block-name">ENTRENAMIENTO · F1</div>
    <div id="timer-wrap">
      <span id="timer">--:--</span>
    </div>

    <div class="phrase">
      <span>CONSTRUIDOS</span>
      <span>DESDE LA</span>
      <span>ADVERSIDAD</span>
    </div>

    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>
  <!-- Enable Audio Overlay -->
  <div id="audio-overlay" class="audio-overlay">
    <div class="overlay-content">
      <button id="enable-audio-btn">Enable Audio</button>
    </div>
  </div>
  <script src="script.js"></script>

</body>
</html>
