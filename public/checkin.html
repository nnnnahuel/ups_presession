<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UP.S Check-in</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #09090b;
        color: #f4f4f5;
      }

      .page {
        min-height: 100vh;
        padding: 8px;
      }

      .card {
        width: 100%;
        max-width: none;
        min-height: calc(100vh - 16px);
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a1a1aa;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 34px;
        line-height: 1.05;
      }

      .muted {
        color: #a1a1aa;
        margin-bottom: 18px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .primary {
        background: #f4f4f5;
        color: #09090b;
      }

      .primary:hover {
        background: #e4e4e7;
      }

      .secondary {
        background: #27272a;
        color: #f4f4f5;
      }

      .secondary:hover {
        background: #323238;
      }

      .reader-wrap {
        position: relative;
        background: #09090b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 10px;
      }

      .camera-layout {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 12px;
        align-items: stretch;
      }

      #reader {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #000;
        aspect-ratio: 16 / 9;
      }

      #readerVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }

      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
      }

      .overlay-box {
        width: min(58vw, 290px);
        aspect-ratio: 1;
        border: 4px solid rgba(255, 255, 255, 0.88);
        border-radius: 16px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.12);
      }

      .status {
        margin-top: 16px;
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 22px;
        border-radius: 18px;
        border: 1px solid #27272a;
        background: #09090b;
        font-size: clamp(28px, 5vw, 54px);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.04em;
        transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
      }

      .status.is-flash {
        transform: scale(1.01);
      }

      .ok {
        border-color: #14532d;
        background: #052e16;
        color: #dcfce7;
      }

      .warn {
        border-color: #854d0e;
        background: #422006;
        color: #fde68a;
      }

      .err {
        border-color: #7f1d1d;
        background: #450a0a;
        color: #fecaca;
      }

      .tools {
        margin-top: 12px;
      }

      .panel {
        margin-top: 12px;
        border: 1px solid #27272a;
        border-radius: 16px;
        background: #111114;
        overflow: hidden;
      }

      .panel-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: transparent;
        color: #f4f4f5;
        padding: 16px 18px;
        border-radius: 0;
      }

      .panel-toggle:hover {
        background: #17171c;
      }

      .panel-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .panel-arrow {
        font-size: 18px;
        line-height: 1;
        transition: transform 0.18s ease;
      }

      .panel.is-open .panel-arrow {
        transform: rotate(180deg);
      }

      .panel-body {
        display: none;
        padding: 0 18px 18px 18px;
        border-top: 1px solid #27272a;
      }

      .panel.is-open .panel-body {
        display: block;
      }

      .camera-notes {
        border: 1px solid #27272a;
        border-radius: 16px;
        background: #111114;
        padding: 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .camera-notes p {
        margin: 0 0 14px 0;
        font-size: 22px;
        line-height: 1.15;
        color: #d4d4d8;
      }

      .camera-notes ol {
        margin: 0;
        padding-left: 28px;
        color: #f4f4f5;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .camera-notes li + li {
        margin-top: 10px;
      }

      .tools-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
      }

      .tools select,
      .manual input {
        width: 100%;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: #f4f4f5;
        border-radius: 12px;
        padding: 14px;
      }

      .manual {
        margin-top: 12px;
      }

      .manual label,
      .tools label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #d4d4d8;
      }

      .manual-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .tiny {
        margin-top: 8px;
        font-size: 12px;
        color: #a1a1aa;
      }

      @media (max-width: 640px) {
        .camera-layout,
        .manual-row,
        .tools-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 28px;
        }

        .status {
          min-height: 130px;
          font-size: clamp(24px, 8vw, 40px);
        }

        .overlay-box {
          width: min(68vw, 250px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="eyebrow">UP.S</div>
        <h1>Check-in</h1>
        <div class="actions">
          <button class="primary" id="startBtn">Iniciar camara</button>
          <button class="secondary" id="stopBtn">Detener camara</button>
        </div>

        <div class="camera-layout">
          <aside class="camera-notes">
            <p>Si el QR no se toma:</p>
            <ol>
              <li>Baja el brillo</li>
              <li>Agranda el QR</li>
            </ol>
          </aside>

          <div class="reader-wrap">
            <div id="reader">
              <video id="readerVideo" autoplay muted playsinline></video>
              <div class="overlay">
                <div class="overlay-box"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="status" class="status">Listo para escanear.</div>

        <div class="tools panel" id="cameraPanel">
          <button class="panel-toggle" id="cameraToggle" type="button" aria-expanded="false" aria-controls="cameraPanelBody">
            <span class="panel-title">Camara</span>
            <span class="panel-arrow">▾</span>
          </button>
          <div class="panel-body" id="cameraPanelBody">
            <div class="tools-grid">
              <select id="cameraSelect">
                <option value="">Seleccionar camara</option>
              </select>
              <button class="secondary" id="mirrorBtn">Espejo: Auto</button>
            </div>
          </div>
        </div>

        <div class="manual panel" id="manualPanel">
          <button class="panel-toggle" id="manualToggle" type="button" aria-expanded="false" aria-controls="manualPanelBody">
            <span class="panel-title">Ingreso manual</span>
            <span class="panel-arrow">▾</span>
          </button>
          <div class="panel-body" id="manualPanelBody">
            <div class="manual-row">
              <input id="manualQr" placeholder="Pegar codigo manual" />
              <button class="secondary" id="manualBtn">Registrar</button>
            </div>
            <div class="tiny">Util si la camara falla o para hacer pruebas rapidas.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytLPt2OIOJwhtbNISzjnxzcbtLfSMfR7PgLg7HgZEarzFOriYNyCLKUuk2QHESQ-uxJQ/exec";
      const SUPABASE_URL = "https://sfwmeifxvangpwrrycda.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmd21laWZ4dmFuZ3B3cnJ5Y2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3MDk5MDksImV4cCI6MjA4NDI4NTkwOX0.Yw0nCjoErcJojKKIbDxkBT985oY1YiP4IugO2qDMd-A";

      let stream = null;
      let isSaving = false;
      let cooldownUntil = 0;
      let lastText = "";
      let activeJsonpScript = null;
      let scanLoopId = 0;
      let selectedCameraId = "";
      let mirrorMode = "auto";
      let statusResetTimer = 0;

      const statusEl = document.getElementById("status");
      const manualQrEl = document.getElementById("manualQr");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const manualBtn = document.getElementById("manualBtn");
      const videoEl = document.getElementById("readerVideo");
      const cameraSelectEl = document.getElementById("cameraSelect");
      const mirrorBtn = document.getElementById("mirrorBtn");
      const cameraPanelEl = document.getElementById("cameraPanel");
      const manualPanelEl = document.getElementById("manualPanel");
      const cameraToggleEl = document.getElementById("cameraToggle");
      const manualToggleEl = document.getElementById("manualToggle");

      function setStatus(message, type = "") {
        statusEl.className = "status";
        if (type) statusEl.classList.add(type);
        statusEl.textContent = message;
      }

      function setTemporaryStatus(message, type = "", duration = 3800) {
        if (statusResetTimer) {
          window.clearTimeout(statusResetTimer);
          statusResetTimer = 0;
        }

        setStatus(message, type);
        statusEl.classList.add("is-flash");

        statusResetTimer = window.setTimeout(() => {
          statusResetTimer = 0;
          setStatus(stream ? "Escanea el QR de tu tarjeta de membresia" : "Listo para escanear.");
        }, duration);
      }

      function beepSuccess() {
        try {
          const context = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = context.createOscillator();
          const gainNode = context.createGain();

          oscillator.type = "sine";
          oscillator.frequency.value = 880;
          gainNode.gain.value = 0.08;

          oscillator.connect(gainNode);
          gainNode.connect(context.destination);

          oscillator.start();
          oscillator.stop(context.currentTime + 0.12);
        } catch (_) {}
      }

      function getMirrorModeLabel() {
        if (mirrorMode === "on") return "Espejo: Si";
        if (mirrorMode === "off") return "Espejo: No";
        return "Espejo: Auto";
      }

      function applyMirrorToPreview() {
        const shouldMirror = mirrorMode !== "off";
        videoEl.style.transform = shouldMirror ? "scaleX(-1)" : "scaleX(1)";
        videoEl.style.transformOrigin = "center";
      }

      function syncControls() {
        mirrorBtn.textContent = getMirrorModeLabel();
        applyMirrorToPreview();
      }

      function setPanelOpen(panelEl, toggleEl, open) {
        panelEl.classList.toggle("is-open", open);
        toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
      }

      function togglePanel(panelEl, toggleEl) {
        const nextOpen = !panelEl.classList.contains("is-open");
        setPanelOpen(panelEl, toggleEl, nextOpen);
      }

      function extractFirstName(res) {
        const directName =
          res?.firstName ||
          res?.firstname ||
          res?.nombre ||
          res?.athleteFirstName ||
          res?.athleteName ||
          res?.name ||
          res?.participantName ||
          res?.playerName ||
          res?.athlete?.firstName ||
          res?.athlete?.firstname ||
          res?.athlete?.name ||
          "";

        const cleaned = String(directName || "").trim();
        if (!cleaned) return "";
        return cleaned.split(/\s+/)[0];
      }

      function buildSuccessMessage(res, fallback) {
        const firstName = extractFirstName(res);
        if (firstName) {
          return "Hola " + firstName + " " + "\u{1F5A4}";
        }
        return fallback;
      }

      function logAttendance(qrCode, athleteName) {
        fetch(SUPABASE_URL + "/rest/v1/attendance_events", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            Prefer: "return=minimal"
          },
          body: JSON.stringify({
            qr_code: qrCode,
            athlete_name: athleteName,
            checked_in_at: new Date().toISOString(),
            source: "qr_scanner"
          })
        }).catch(() => {});
      }

      function jsonp(url) {
        return new Promise((resolve, reject) => {
          const callbackName = "upsCheckinCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

          window[callbackName] = function (data) {
            cleanup();
            resolve(data);
          };

          function cleanup() {
            if (activeJsonpScript && activeJsonpScript.parentNode) {
              activeJsonpScript.parentNode.removeChild(activeJsonpScript);
            }
            activeJsonpScript = null;
            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          }

          const script = document.createElement("script");
          const separator = url.includes("?") ? "&" : "?";
          script.src = `${url}${separator}callback=${callbackName}`;
          script.async = true;

          script.onerror = function () {
            cleanup();
            reject(new Error("No pude conectar con Apps Script."));
          };

          activeJsonpScript = script;
          document.body.appendChild(script);

          setTimeout(() => {
            if (window[callbackName]) {
              cleanup();
              reject(new Error("La API tardo demasiado en responder."));
            }
          }, 10000);
        });
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter((device) => device.kind === "videoinput");
      }

      function pickCamera(cameras) {
        if (!Array.isArray(cameras) || cameras.length === 0) return null;

        const preferred = cameras.find((camera) => {
          const label = String(camera.label || "");
          return /rear|back|environment|world|extern|usb/i.test(label);
        });

        return preferred || cameras[0];
      }

      function fillCameraOptions(cameras) {
        cameraSelectEl.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Seleccionar camara";
        cameraSelectEl.appendChild(placeholder);

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");
          option.value = camera.deviceId;
          option.textContent = camera.label || "Camara " + (index + 1);
          cameraSelectEl.appendChild(option);
        });

        if (!selectedCameraId) {
          const preferred = pickCamera(cameras);
          selectedCameraId = preferred ? preferred.deviceId : "";
        }

        cameraSelectEl.value = selectedCameraId;
      }

      async function stopScanner() {
        if (statusResetTimer) {
          window.clearTimeout(statusResetTimer);
          statusResetTimer = 0;
        }

        if (scanLoopId) {
          window.cancelAnimationFrame(scanLoopId);
          scanLoopId = 0;
        }

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }

        videoEl.srcObject = null;
        setStatus("Camara detenida.", "");
        syncControls();
      }

      function decodeFrame(mirrored) {
        if (typeof window.jsQR !== "function") {
          return null;
        }

        const width = videoEl.videoWidth;
        const height = videoEl.videoHeight;
        if (!width || !height) {
          return null;
        }

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        if (!context) {
          return null;
        }

        canvas.width = width;
        canvas.height = height;

        context.save();
        if (mirrored) {
          context.translate(width, 0);
          context.scale(-1, 1);
        }
        context.drawImage(videoEl, 0, 0, width, height);
        context.restore();

        const imageData = context.getImageData(0, 0, width, height);
        const result = window.jsQR(imageData.data, width, height, {
          inversionAttempts: "attemptBoth"
        });

        return result ? result.data : null;
      }

      async function saveCheckin(qrText) {
        const cleaned = String(qrText || "").trim();

        if (!cleaned) {
          setStatus("Codigo vacio.", "warn");
          return;
        }

        if (isSaving) return;

        const now = Date.now();
        if (cleaned === lastText && now < cooldownUntil) return;

        isSaving = true;
        lastText = cleaned;
        cooldownUntil = now + 1800;

        setStatus("Verificando QR... Ya podes retirar el QR de la camara.", "warn");

        try {
          const url = APPS_SCRIPT_URL + "?action=register&qrText=" + encodeURIComponent(cleaned);
          const res = await jsonp(url);

          if (!res.ok && !res.found) {
            setStatus(res.message || "No se pudo registrar.", "err");
          } else if (res.duplicate) {
            setTemporaryStatus(buildSuccessMessage(res, res.message || "Ya registrado."), "warn");
            beepSuccess();
          } else {
            const name = extractFirstName(res);
            logAttendance(cleaned, name);
            setTemporaryStatus(buildSuccessMessage(res, res.message || "Check-in registrado."), "ok");
            beepSuccess();
          }

          manualQrEl.value = "";
        } catch (error) {
          setStatus("Error al registrar: " + error.message, "err");
        } finally {
          isSaving = false;
        }
      }

      function startScanLoop() {
        const tick = () => {
          if (!stream) return;

          if (videoEl.readyState >= 2 && !isSaving) {
            const attempts = mirrorMode === "on"
              ? [true]
              : mirrorMode === "off"
                ? [false]
                : [false, true];

            for (const mirrored of attempts) {
              const result = decodeFrame(mirrored);
              if (result) {
                saveCheckin(result);
                break;
              }
            }
          }

          scanLoopId = window.requestAnimationFrame(tick);
        };

        scanLoopId = window.requestAnimationFrame(tick);
      }

      async function startScanner() {
        try {
          await stopScanner();

          const constraints = {
            audio: false,
            video: selectedCameraId
              ? {
                  deviceId: { exact: selectedCameraId },
                  width: { ideal: 1920 },
                  height: { ideal: 1080 }
                }
              : {
                  facingMode: "environment",
                  width: { ideal: 1920 },
                  height: { ideal: 1080 }
                }
          };

          stream = await navigator.mediaDevices.getUserMedia(constraints);
          videoEl.srcObject = stream;
          await videoEl.play();

          const cameras = await listCameras();
          fillCameraOptions(cameras);

          const track = stream.getVideoTracks()[0];
          if (!selectedCameraId && track) {
            const settings = track.getSettings ? track.getSettings() : null;
            selectedCameraId = settings && settings.deviceId ? settings.deviceId : "";
          }

          setPanelOpen(cameraPanelEl, cameraToggleEl, true);
          syncControls();
          startScanLoop();
          setStatus("Escanea el QR de tu tarjeta de membresia", "");
        } catch (error) {
          console.error(error);
          setStatus("No pude iniciar la camara o leer el QR.", "err");
        }
      }

      startBtn.addEventListener("click", startScanner);
      stopBtn.addEventListener("click", stopScanner);

      manualBtn.addEventListener("click", () => {
        saveCheckin(manualQrEl.value);
      });

      manualQrEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          saveCheckin(manualQrEl.value);
        }
      });

      cameraSelectEl.addEventListener("change", () => {
        selectedCameraId = cameraSelectEl.value;
      });

      mirrorBtn.addEventListener("click", () => {
        mirrorMode = mirrorMode === "auto" ? "off" : mirrorMode === "off" ? "on" : "auto";
        syncControls();
      });

      cameraToggleEl.addEventListener("click", () => {
        togglePanel(cameraPanelEl, cameraToggleEl);
      });

      manualToggleEl.addEventListener("click", () => {
        togglePanel(manualPanelEl, manualToggleEl);
      });

      (async function init() {
        try {
          const cameras = await listCameras();
          fillCameraOptions(cameras);

          const res = await jsonp(APPS_SCRIPT_URL + "?action=ping");
          if (res && res.ok) {
            setStatus("Listo para escanear.", "");
          } else {
            setStatus("La API respondio, pero no como esperaba.", "warn");
          }
        } catch (error) {
          setStatus("No pude conectar con Apps Script: " + error.message, "err");
        }

        syncControls();
        setPanelOpen(cameraPanelEl, cameraToggleEl, false);
        setPanelOpen(manualPanelEl, manualToggleEl, false);
      })();
    </script>
  </body>
</html>
