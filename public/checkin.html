<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UP.S Check-in</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <style>
      :root { color-scheme: dark; }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: Inter, Arial, sans-serif;
        background: #000;
        color: #f4f4f5;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /* ── CAMERA FULL SCREEN ── */
      #reader {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #000;
      }

      #readerVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
      }

      .overlay-box {
        width: min(38vw, 300px);
        aspect-ratio: 1;
        border: 3px solid rgba(255,255,255,0.85);
        border-radius: 16px;
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.08);
      }

      /* ── TOP BAR WIDGET ── */
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(255,255,255,0.07);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button, input, select { font: inherit; }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        transition: 0.15s ease;
        font-size: 14px;
      }

      .primary {
        background: rgba(244,244,245,0.92);
        color: #09090b;
      }
      .primary:hover { background: #f4f4f5; }

      .secondary {
        background: rgba(39,39,42,0.85);
        color: #f4f4f5;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .secondary:hover { background: rgba(55,55,60,0.9); }

      /* ── BOTTOM UI ── */
      .bottom-ui {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .panels-row {
        display: flex;
        gap: 8px;
      }

      /* ── STATUS ── */
      .status {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px 22px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(9,9,11,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        font-size: clamp(32px, 5.5vw, 76px);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.04em;
        transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
      }

      .status.is-flash { transform: scale(1.01); }

      .ok   { border-color: #14532d; background: rgba(5,46,22,0.88);  color: #dcfce7; }
      .warn { border-color: #854d0e; background: rgba(66,32,6,0.88);  color: #fde68a; }
      .err  { border-color: #7f1d1d; background: rgba(69,10,10,0.88); color: #fecaca; }

      /* ── PANELS ── */
      .panel {
        flex: 1;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        background: rgba(15,15,18,0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .panel-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: transparent;
        color: #f4f4f5;
        padding: 13px 16px;
        border-radius: 0;
        border: 0;
        cursor: pointer;
      }
      .panel-toggle:hover { background: rgba(255,255,255,0.04); }

      .panel-title { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; }
      .panel-arrow { font-size: 15px; transition: transform 0.18s ease; }
      .panel.is-open .panel-arrow { transform: rotate(180deg); }

      .panel-body {
        display: none;
        padding: 0 14px 14px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      .panel.is-open .panel-body { display: block; }

      .tools-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: end;
        padding-top: 12px;
      }

      .tools select, .manual input {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(9,9,11,0.85);
        color: #f4f4f5;
        border-radius: 10px;
        padding: 10px 14px;
      }

      .tools label, .manual label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: #a1a1aa;
      }

      .manual-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding-top: 12px;
      }

      .tiny { margin-top: 8px; font-size: 11px; color: #52525b; }

      /* ── FILTER BAR ── */
      .filter-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .filter-btn {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 9px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        background: rgba(15,15,18,0.80);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #71717a;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .filter-btn:hover { color: #d4d4d8; background: rgba(35,35,40,0.90); }
      .filter-btn.active {
        background: rgba(244,244,245,0.92);
        color: #09090b;
        border-color: transparent;
      }

      /* ── MOBILE ── */
      @media (max-width: 640px) {
        .overlay-box { width: min(72vw, 300px); }
        .top-bar { padding: 10px 14px; }
      }
    </style>
  </head>
  <body>

    <!-- FULL SCREEN CAMERA -->
    <div id="reader">
      <video id="readerVideo" autoplay muted playsinline></video>
      <div class="overlay">
        <div class="overlay-box"></div>
      </div>
    </div>

    <!-- TOP BAR: solo botones -->
    <div class="top-bar">
      <button class="primary" id="startBtn">Iniciar cámara</button>
      <button class="secondary" id="stopBtn">Detener cámara</button>
    </div>

    <!-- BOTTOM UI WIDGETS -->
    <div class="bottom-ui">
      <!-- Paneles ocultos (funcionalidad preservada para uso programático) -->
      <div class="panels-row" style="display:none">

        <div class="tools panel" id="cameraPanel" style="display:none">
          <button class="panel-toggle" id="cameraToggle" type="button" aria-expanded="false" aria-controls="cameraPanelBody">
            <span class="panel-title">Cámara</span>
            <span class="panel-arrow">▾</span>
          </button>
          <div class="panel-body" id="cameraPanelBody">
            <div class="tools-grid">
              <div>
                <label for="cameraSelect">Fuente de video</label>
                <select id="cameraSelect">
                  <option value="">Seleccionar cámara</option>
                </select>
              </div>
              <button class="secondary" id="mirrorBtn">Espejo: Auto</button>
            </div>
          </div>
        </div>

        <div class="manual panel" id="manualPanel" style="display:none">
          <button class="panel-toggle" id="manualToggle" type="button" aria-expanded="false" aria-controls="manualPanelBody">
            <span class="panel-title">Ingreso manual</span>
            <span class="panel-arrow">▾</span>
          </button>
          <div class="panel-body" id="manualPanelBody">
            <div class="manual-row">
              <input id="manualQr" placeholder="Pegar código manual" />
              <button class="secondary" id="manualBtn">Registrar</button>
            </div>
            <div class="tiny">Útil si la cámara falla o para hacer pruebas rápidas.</div>
          </div>
        </div>

      </div>
      <!-- Presets de filtro de cámara -->
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="normal">Normal</button>
        <button class="filter-btn" data-filter="dark">Oscuro</button>
        <button class="filter-btn" data-filter="dark-plus">Oscuro+</button>
        <button class="filter-btn" data-filter="very-dark">Muy oscuro</button>
      </div>

      <div id="status" class="status">Listo para escanear.</div>
    </div>

    <script>
      const SUPABASE_URL = "https://sfwmeifxvangpwrrycda.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmd21laWZ4dmFuZ3B3cnJ5Y2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3MDk5MDksImV4cCI6MjA4NDI4NTkwOX0.Yw0nCjoErcJojKKIbDxkBT985oY1YiP4IugO2qDMd-A";

      // ── Presets de filtro ─────────────────────────────────────
      // El filtro se aplica:
      //   1. Visualmente al <video> → menos luz emitida por la pantalla → menos reflejo en el cel
      //   2. En context.filter antes de drawImage → jsQR lee los datos ya filtrados
      const FILTER_PRESETS = {
        "normal":     "none",
        "dark":       "brightness(0.40) contrast(2.0)",
        "dark-plus":  "brightness(0.28) contrast(2.4)",
        "very-dark":  "brightness(0.18) contrast(2.8)",
      };

      let currentFilterKey = "normal";

      let stream = null;
      let isSaving = false;
      let cooldownUntil = 0;
      let lastText = "";
      let scanLoopId = 0;
      let selectedCameraId = "";
      let mirrorMode = "auto";
      let statusResetTimer = 0;
      let mobileDetectionInFlight = false;
      let mobileBarcodeDetectorPromise = null;
      let mobileBarcodeDetectorDisabled = false;
      let mobileScanCanvas = null;
      let mobileScanContext = null;
      let mobileScanRegions = [];
      let desktopScanCanvas = null;
      let desktopScanContext = null;

      const statusEl = document.getElementById("status");
      const manualQrEl = document.getElementById("manualQr");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const manualBtn = document.getElementById("manualBtn");
      const videoEl = document.getElementById("readerVideo");
      const cameraSelectEl = document.getElementById("cameraSelect");
      const mirrorBtn = document.getElementById("mirrorBtn");
      const cameraPanelEl = document.getElementById("cameraPanel");
      const manualPanelEl = document.getElementById("manualPanel");
      const cameraToggleEl = document.getElementById("cameraToggle");
      const manualToggleEl = document.getElementById("manualToggle");
      const isPhoneLayout = window.matchMedia("(max-width: 640px)");

      function setStatus(message, type = "") {
        statusEl.className = "status";
        if (type) statusEl.classList.add(type);
        statusEl.textContent = message;
      }

      function setTemporaryStatus(message, type = "", duration = 3800) {
        if (statusResetTimer) {
          window.clearTimeout(statusResetTimer);
          statusResetTimer = 0;
        }

        setStatus(message, type);
        statusEl.classList.add("is-flash");

        statusResetTimer = window.setTimeout(() => {
          statusResetTimer = 0;
          setStatus(stream ? "Escanea el QR de tu tarjeta de membresia" : "Listo para escanear.");
        }, duration);
      }

      function beepSuccess() {
        try {
          const context = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = context.createOscillator();
          const gainNode = context.createGain();

          oscillator.type = "sine";
          oscillator.frequency.value = 880;
          gainNode.gain.value = 0.08;

          oscillator.connect(gainNode);
          gainNode.connect(context.destination);

          oscillator.start();
          oscillator.stop(context.currentTime + 0.12);
        } catch (_) {}
      }

      function getMirrorModeLabel() {
        if (mirrorMode === "on") return "Espejo: Si";
        if (mirrorMode === "off") return "Espejo: No";
        return "Espejo: Auto";
      }

      function shouldMirrorPreview() {
        if (mirrorMode === "on") return true;
        if (mirrorMode === "off") return false;

        const track = stream ? stream.getVideoTracks()[0] : null;
        const settings = track && track.getSettings ? track.getSettings() : null;
        const facingMode = String(settings && settings.facingMode ? settings.facingMode : "").toLowerCase();

        if (facingMode === "environment") return false;
        if (facingMode === "user") return true;
        return !isPhoneLayout.matches;
      }

      function applyMirrorToPreview() {
        const shouldMirror = shouldMirrorPreview();
        videoEl.style.transform = shouldMirror ? "scaleX(-1)" : "scaleX(1)";
        videoEl.style.transformOrigin = "center";
      }

      function syncControls() {
        mirrorBtn.textContent = getMirrorModeLabel();
        applyMirrorToPreview();
      }

      function setPanelOpen(panelEl, toggleEl, open) {
        panelEl.classList.toggle("is-open", open);
        toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
      }

      function togglePanel(panelEl, toggleEl) {
        const nextOpen = !panelEl.classList.contains("is-open");
        setPanelOpen(panelEl, toggleEl, nextOpen);
      }

      function extractFirstName(res) {
        const directName =
          res?.firstName ||
          res?.firstname ||
          res?.nombre ||
          res?.athleteFirstName ||
          res?.athleteName ||
          res?.name ||
          res?.participantName ||
          res?.playerName ||
          res?.athlete?.firstName ||
          res?.athlete?.firstname ||
          res?.athlete?.name ||
          "";

        const cleaned = String(directName || "").trim();
        if (!cleaned) return "";
        return cleaned.split(/\s+/)[0];
      }

      function buildSuccessMessage(res, fallback) {
        const firstName = extractFirstName(res);
        if (firstName) {
          return "Hola " + firstName + " " + "\u{1F5A4}";
        }
        return fallback;
      }

      async function getMobileBarcodeDetector() {
        if (!isPhoneLayout.matches || mobileBarcodeDetectorDisabled || typeof window.BarcodeDetector !== "function") {
          return null;
        }

        if (!mobileBarcodeDetectorPromise) {
          mobileBarcodeDetectorPromise = (async () => {
            try {
              if (typeof window.BarcodeDetector.getSupportedFormats === "function") {
                const formats = await window.BarcodeDetector.getSupportedFormats();
                if (Array.isArray(formats) && !formats.includes("qr_code")) {
                  return null;
                }
              }

              return new window.BarcodeDetector({ formats: ["qr_code"] });
            } catch (_) {
              return null;
            }
          })();
        }

        return mobileBarcodeDetectorPromise;
      }

      async function detectMobileBarcode() {
        const detector = await getMobileBarcodeDetector();
        if (!detector) return "";

        try {
          const regions = mobileScanRegions.length > 0 ? mobileScanRegions : [{ sx: 0, sy: 0, sw: videoEl.videoWidth, sh: videoEl.videoHeight }];
          const presets = ["normal", "contrast"];

          for (const region of regions) {
            for (const preset of presets) {
              const source = drawMobileScanCanvas(false, preset, region);
              if (!source) continue;

              const barcodes = await detector.detect(source);
              if (!Array.isArray(barcodes) || barcodes.length === 0) continue;

              const first = barcodes[0];
              const value = String(first?.rawValue || first?.value || "").trim();
              if (value) return value;
            }
          }

          return "";
        } catch (_) {
          mobileBarcodeDetectorDisabled = true;
          mobileBarcodeDetectorPromise = null;
          return "";
        }
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter((device) => device.kind === "videoinput");
      }

      function pickCamera(cameras) {
        if (!Array.isArray(cameras) || cameras.length === 0) return null;

        const preferred = cameras.find((camera) => {
          const label = String(camera.label || "");
          return /rear|back|environment|world|extern|usb/i.test(label);
        });

        return preferred || cameras[0];
      }

      function pickMobileRearCamera(cameras) {
        if (!Array.isArray(cameras) || cameras.length === 0) return null;

        const scored = cameras
          .map((camera) => {
            const label = String(camera.label || "").toLowerCase();
            let score = 0;

            if (/rear|back|environment|world/.test(label)) score += 50;
            if (/front|user|selfie|facetime/.test(label)) score -= 100;
            if (/ultra|macro|depth/.test(label)) score -= 20;

            return { camera, score };
          })
          .sort((a, b) => b.score - a.score);

        return scored[0] ? scored[0].camera : null;
      }

      function buildVideoConstraints(deviceId = "") {
        if (deviceId) {
          return {
            deviceId: { exact: deviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          };
        }

        return {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        };
      }

      function buildMobileScanRegions(width, height) {
        const regions = [];
        const full = { sx: 0, sy: 0, sw: width, sh: height };
        regions.push(full);

        const scale = 0.72;
        const sw = Math.max(1, Math.round(width * scale));
        const sh = Math.max(1, Math.round(height * scale));
        const centers = [
          { x: 0.5, y: 0.5 },
          { x: 0.25, y: 0.25 },
          { x: 0.75, y: 0.25 },
          { x: 0.25, y: 0.75 },
          { x: 0.75, y: 0.75 }
        ];

        centers.forEach(({ x, y }) => {
          const sx = Math.max(0, Math.min(width - sw, Math.round(width * x - sw / 2)));
          const sy = Math.max(0, Math.min(height - sh, Math.round(height * y - sh / 2)));
          regions.push({ sx, sy, sw, sh });
        });

        return regions;
      }

      function fillCameraOptions(cameras) {
        cameraSelectEl.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Seleccionar cámara";
        cameraSelectEl.appendChild(placeholder);

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");
          option.value = camera.deviceId;
          option.textContent = camera.label || "Cámara " + (index + 1);
          cameraSelectEl.appendChild(option);
        });

        if (!selectedCameraId && !isPhoneLayout.matches) {
          const preferred = pickCamera(cameras);
          selectedCameraId = preferred ? preferred.deviceId : "";
        }

        cameraSelectEl.value = selectedCameraId;
      }

      async function stopScanner() {
        if (statusResetTimer) {
          window.clearTimeout(statusResetTimer);
          statusResetTimer = 0;
        }

        if (scanLoopId) {
          window.cancelAnimationFrame(scanLoopId);
          scanLoopId = 0;
        }

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }

        videoEl.srcObject = null;
        mobileDetectionInFlight = false;
        setStatus("Cámara detenida.", "");
        syncControls();
      }

      function ensureMobileScanCanvas(width, height) {
        if (!mobileScanCanvas) {
          mobileScanCanvas = document.createElement("canvas");
          mobileScanContext = mobileScanCanvas.getContext("2d", { willReadFrequently: true });
        }
        if (!mobileScanContext) return null;

        if (mobileScanCanvas.width !== width) mobileScanCanvas.width = width;
        if (mobileScanCanvas.height !== height) mobileScanCanvas.height = height;
        return mobileScanCanvas;
      }

      function applyMobileImagePreset(imageData, preset) {
        const data = imageData.data;

        if (preset === "contrast") {
          const contrast = 1.65;
          for (let index = 0; index < data.length; index += 4) {
            const luminance = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
            const value = Math.max(0, Math.min(255, (luminance - 128) * contrast + 128));
            data[index] = value;
            data[index + 1] = value;
            data[index + 2] = value;
          }
          return imageData;
        }

        if (preset === "threshold") {
          let minLuma = 255;
          let maxLuma = 0;

          for (let index = 0; index < data.length; index += 4) {
            const luminance = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
            if (luminance < minLuma) minLuma = luminance;
            if (luminance > maxLuma) maxLuma = luminance;
          }

          const threshold = (minLuma + maxLuma) / 2;
          for (let index = 0; index < data.length; index += 4) {
            const luminance = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
            const value = luminance >= threshold ? 255 : 0;
            data[index] = value;
            data[index + 1] = value;
            data[index + 2] = value;
          }
        }

        return imageData;
      }

      function drawMobileScanCanvas(mirrored, preset = "normal", region = null) {
        const width = videoEl.videoWidth;
        const height = videoEl.videoHeight;
        if (!width || !height) return null;

        const scanRegion = region || { sx: 0, sy: 0, sw: width, sh: height };
        const scale = Math.min(1, 960 / Math.max(scanRegion.sw, scanRegion.sh));
        const targetWidth = Math.max(1, Math.round(scanRegion.sw * scale));
        const targetHeight = Math.max(1, Math.round(scanRegion.sh * scale));
        const canvas = ensureMobileScanCanvas(targetWidth, targetHeight);
        if (!canvas || !mobileScanContext) return null;

        mobileScanContext.save();
        mobileScanContext.clearRect(0, 0, targetWidth, targetHeight);
        if (mirrored) {
          mobileScanContext.translate(targetWidth, 0);
          mobileScanContext.scale(-1, 1);
        }
        mobileScanContext.drawImage(videoEl, scanRegion.sx, scanRegion.sy, scanRegion.sw, scanRegion.sh, 0, 0, targetWidth, targetHeight);
        mobileScanContext.restore();

        if (preset !== "normal") {
          const imageData = mobileScanContext.getImageData(0, 0, targetWidth, targetHeight);
          mobileScanContext.putImageData(applyMobileImagePreset(imageData, preset), 0, 0);
        }

        return canvas;
      }

      // Desktop canvas: aplica el filtro seleccionado + pixel preset adicional
      function drawDesktopScanCanvas(mirrored, pixelPreset = "normal") {
        const width = videoEl.videoWidth;
        const height = videoEl.videoHeight;
        if (!width || !height) return null;

        if (!desktopScanCanvas) {
          desktopScanCanvas = document.createElement("canvas");
          desktopScanContext = desktopScanCanvas.getContext("2d", { willReadFrequently: true });
        }
        if (!desktopScanContext) return null;

        desktopScanCanvas.width = width;
        desktopScanCanvas.height = height;

        // Aplica el filtro CSS seleccionado al dibujar en canvas
        // → afecta tanto la pantalla (menos brillo/reflejo) como los datos que lee jsQR
        const cssFilter = FILTER_PRESETS[currentFilterKey] || "none";

        desktopScanContext.save();
        desktopScanContext.clearRect(0, 0, width, height);
        if (cssFilter !== "none") desktopScanContext.filter = cssFilter;
        if (mirrored) {
          desktopScanContext.translate(width, 0);
          desktopScanContext.scale(-1, 1);
        }
        desktopScanContext.drawImage(videoEl, 0, 0, width, height);
        desktopScanContext.restore();
        desktopScanContext.filter = "none"; // reset

        if (pixelPreset !== "normal") {
          const imageData = desktopScanContext.getImageData(0, 0, width, height);
          desktopScanContext.putImageData(applyMobileImagePreset(imageData, pixelPreset), 0, 0);
        }

        return desktopScanCanvas;
      }

      function applyVideoFilter() {
        const cssFilter = FILTER_PRESETS[currentFilterKey] || "none";
        videoEl.style.filter = cssFilter;
      }

      function decodeFrame(mirrored) {
        if (typeof window.jsQR !== "function") {
          return null;
        }

        if (isPhoneLayout.matches) {
          const regions = mobileScanRegions.length > 0 ? mobileScanRegions : [{ sx: 0, sy: 0, sw: videoEl.videoWidth, sh: videoEl.videoHeight }];
          const presets = ["normal", "contrast", "threshold"];

          for (const region of regions) {
            for (const preset of presets) {
              const canvas = drawMobileScanCanvas(mirrored, preset, region);
              if (!canvas || !mobileScanContext) continue;

              const imageData = mobileScanContext.getImageData(0, 0, canvas.width, canvas.height);
              const result = window.jsQR(imageData.data, canvas.width, canvas.height, {
                inversionAttempts: "attemptBoth"
              });
              if (result) return result.data;
            }
          }

          return null;
        }

        // Desktop: try normal then contrast (fixes glare from bright screen)
        const presets = ["normal", "contrast"];
        for (const preset of presets) {
          const canvas = drawDesktopScanCanvas(mirrored, preset);
          if (!canvas || !desktopScanContext) continue;

          const imageData = desktopScanContext.getImageData(0, 0, canvas.width, canvas.height);
          const result = window.jsQR(imageData.data, canvas.width, canvas.height, {
            inversionAttempts: "attemptBoth"
          });
          if (result) return result.data;
        }

        return null;
      }

      async function applyTrackConstraints(track) {
        if (!track || typeof track.getCapabilities !== "function" || typeof track.applyConstraints !== "function") {
          return;
        }

        try {
          const capabilities = track.getCapabilities();
          const advanced = [];

          if (Array.isArray(capabilities.focusMode) && capabilities.focusMode.includes("continuous")) {
            advanced.push({ focusMode: "continuous" });
          }

          if (Array.isArray(capabilities.exposureMode) && capabilities.exposureMode.includes("continuous")) {
            advanced.push({ exposureMode: "continuous" });
          }

          if (capabilities.zoom && typeof capabilities.zoom.max === "number" && typeof capabilities.zoom.min === "number" && capabilities.zoom.max > capabilities.zoom.min) {
            const preferredZoom = Math.min(capabilities.zoom.max, Math.max(capabilities.zoom.min, 1.5));
            advanced.push({ zoom: preferredZoom });
          }

          if (advanced.length) {
            await track.applyConstraints({ advanced });
          }
        } catch (_) {}
      }

      function refreshMobileScanRegions() {
        if (!isPhoneLayout.matches) {
          mobileScanRegions = [];
          return;
        }

        const width = videoEl.videoWidth;
        const height = videoEl.videoHeight;
        if (!width || !height) {
          mobileScanRegions = [];
          return;
        }

        mobileScanRegions = buildMobileScanRegions(width, height);
      }

      async function saveCheckin(qrText) {
        const cleaned = String(qrText || "").trim();

        if (!cleaned) {
          setStatus("Código vacío.", "warn");
          return;
        }

        if (isSaving) return;

        const now = Date.now();
        if (cleaned === lastText && now < cooldownUntil) return;

        isSaving = true;
        lastText = cleaned;
        cooldownUntil = now + 1800;

        setStatus("Verificando QR... Ya podés retirar el QR de la cámara.", "warn");

        try {
          const headers = {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          };
          const profileResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/athletes?qr_code=eq.${encodeURIComponent(cleaned)}&select=full_name,id`,
            { headers }
          );
          if (!profileResponse.ok) {
            throw new Error("No se pudo consultar el atleta.");
          }

          const profiles = await profileResponse.json();
          if (!Array.isArray(profiles) || profiles.length === 0) {
            setStatus("QR no reconocido.", "err");
            manualQrEl.value = "";
            return;
          }

          const athleteName = String(profiles[0]?.full_name || "").trim();
          const todayIso = new Date().toISOString().slice(0, 10) + "T00:00:00.000Z";
          const duplicateResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/attendance_events?qr_code=eq.${encodeURIComponent(cleaned)}&checked_in_at=gte.${todayIso}&source=eq.qr_scanner&select=id`,
            { headers }
          );
          if (!duplicateResponse.ok) {
            throw new Error("No se pudo validar asistencia previa.");
          }

          const duplicates = await duplicateResponse.json();
          if (Array.isArray(duplicates) && duplicates.length > 0) {
            manualQrEl.value = "";
            setTemporaryStatus(buildSuccessMessage({ athleteName: athleteName }, "Ya registrado hoy."), "warn");
            beepSuccess();
            return;
          }

          const insertResponse = await fetch(SUPABASE_URL + "/rest/v1/attendance_events", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + SUPABASE_ANON_KEY,
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              qr_code: cleaned,
              athlete_name: athleteName,
              checked_in_at: new Date().toISOString(),
              source: "qr_scanner"
            })
          });
          if (!insertResponse.ok) {
            throw new Error("No se pudo registrar el check-in.");
          }

          manualQrEl.value = "";
          setTemporaryStatus(buildSuccessMessage({ athleteName: athleteName }, "Check-in registrado."), "ok");
          beepSuccess();
        } catch (error) {
          setStatus("Error al registrar: " + error.message, "err");
        } finally {
          isSaving = false;
        }
      }

      function startScanLoop() {
        const tick = () => {
          if (!stream) return;

          if (videoEl.readyState >= 2 && !isSaving) {
            if (isPhoneLayout.matches && !mobileDetectionInFlight) {
              mobileDetectionInFlight = true;
              detectMobileBarcode()
                .then((result) => {
                  if (result && !isSaving) {
                    saveCheckin(result);
                  }
                })
                .finally(() => {
                  mobileDetectionInFlight = false;
                });
            }

            const canUseJsQrFallback = !isPhoneLayout.matches || mobileBarcodeDetectorDisabled || typeof window.BarcodeDetector !== "function";
            const attempts = mirrorMode === "on"
              ? [true]
              : mirrorMode === "off"
                ? [false]
                : [false, true];

            if (canUseJsQrFallback) {
              for (const mirrored of attempts) {
                const result = decodeFrame(mirrored);
                if (result) {
                  saveCheckin(result);
                  break;
                }
              }
            }
          }

          scanLoopId = window.requestAnimationFrame(tick);
        };

        scanLoopId = window.requestAnimationFrame(tick);
      }

      async function startScanner() {
        try {
          await stopScanner();

          const initialDeviceId = !isPhoneLayout.matches ? selectedCameraId : "";
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: buildVideoConstraints(initialDeviceId)
          });
          videoEl.srcObject = stream;
          await videoEl.play();
          refreshMobileScanRegions();

          const cameras = await listCameras();
          fillCameraOptions(cameras);

          let track = stream.getVideoTracks()[0];
          let settings = track && track.getSettings ? track.getSettings() : null;
          const activeDeviceId = settings && settings.deviceId ? settings.deviceId : "";

          if (isPhoneLayout.matches) {
            const preferredCamera = pickMobileRearCamera(cameras);
            if (preferredCamera && preferredCamera.deviceId && preferredCamera.deviceId !== activeDeviceId) {
              stream.getTracks().forEach((activeTrack) => activeTrack.stop());
              stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: buildVideoConstraints(preferredCamera.deviceId)
              });
              videoEl.srcObject = stream;
              await videoEl.play();
              refreshMobileScanRegions();
              track = stream.getVideoTracks()[0];
              settings = track && track.getSettings ? track.getSettings() : null;
            }
          } else if (!selectedCameraId && track) {
            if (settings) {
              selectedCameraId = settings && settings.deviceId ? settings.deviceId : "";
            }
          }

          // Apply focus/exposure constraints on all devices
          await applyTrackConstraints(track);

          applyVideoFilter(); // aplica filtro visual seleccionado
          syncControls();
          startScanLoop();
          setStatus("Escanea el QR de tu tarjeta de membresia", "");
        } catch (error) {
          console.error(error);
          setStatus("No pude iniciar la cámara o leer el QR.", "err");
        }
      }

      // ── Filter preset buttons ────────────────────────────────
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentFilterKey = btn.dataset.filter;
          document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          applyVideoFilter();
        });
      });

      startBtn.addEventListener("click", startScanner);
      stopBtn.addEventListener("click", stopScanner);

      manualBtn.addEventListener("click", () => {
        saveCheckin(manualQrEl.value);
      });

      manualQrEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          saveCheckin(manualQrEl.value);
        }
      });

      cameraSelectEl.addEventListener("change", () => {
        selectedCameraId = cameraSelectEl.value;
      });

      mirrorBtn.addEventListener("click", () => {
        mirrorMode = mirrorMode === "auto" ? "off" : mirrorMode === "off" ? "on" : "auto";
        syncControls();
      });

      cameraToggleEl.addEventListener("click", () => {
        togglePanel(cameraPanelEl, cameraToggleEl);
      });

      manualToggleEl.addEventListener("click", () => {
        togglePanel(manualPanelEl, manualToggleEl);
      });

      (async function init() {
        try {
          const cameras = await listCameras();
          fillCameraOptions(cameras);

          const res = await fetch(`${SUPABASE_URL}/rest/v1/athletes?select=id&limit=1`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + SUPABASE_ANON_KEY
            }
          });
          if (res.ok) {
            setStatus("Listo para escanear.", "");
          } else {
            setStatus("Supabase respondió, pero no como esperaba.", "warn");
          }
        } catch (error) {
          setStatus("No pude conectar con Supabase: " + error.message, "err");
        }

        syncControls();
        setPanelOpen(cameraPanelEl, cameraToggleEl, false);
        setPanelOpen(manualPanelEl, manualToggleEl, false);

        // Auto-start cámara en todos los dispositivos
        await startScanner();
      })();

      // ── Spotify Web Playback SDK ──────────────────────────────
      let _spotifyPlayer = null;

      async function fetchSdkToken() {
        const r = await fetch("/checkin/sdk-token");
        if (!r.ok) throw new Error("sdk_token_unavailable");
        const { token } = await r.json();
        return token;
      }

      window.onSpotifyWebPlaybackSDKReady = async () => {
        try {
          const token = await fetchSdkToken();
          const player = new Spotify.Player({
            name: "UP.S Check-In",
            getOAuthToken: (cb) => fetchSdkToken().then(cb).catch(() => {}),
            volume: 0.9,
          });
          player.connect();
          _spotifyPlayer = player;
        } catch (_) {}
      };

      function rampPlayerVolume(targetPct, duration) {
        const player = _spotifyPlayer;
        if (!player) return;
        player.getVolume().then((startVol) => {
          const targetVol = targetPct / 100;
          const steps = 20;
          const stepMs = Math.max(50, duration / steps);
          let step = 0;
          const iv = setInterval(() => {
            step++;
            const vol = startVol + (targetVol - startVol) * (step / steps);
            player.setVolume(Math.max(0, Math.min(1, vol)));
            if (step >= steps) clearInterval(iv);
          }, stepMs);
        });
      }

      // ── SSE — recibe comandos de volumen del servidor ─────────
      (function connectCheckinEvents() {
        const src = new EventSource("/checkin/events");
        src.addEventListener("rampVolume", (e) => {
          const { targetPct, duration } = JSON.parse(e.data);
          rampPlayerVolume(targetPct, duration);
        });
        src.addEventListener("setVolume", (e) => {
          const { pct } = JSON.parse(e.data);
          if (_spotifyPlayer) _spotifyPlayer.setVolume(pct / 100);
        });
        src.onerror = () => {
          src.close();
          setTimeout(connectCheckinEvents, 5000);
        };
      })();
    </script>
  </body>
</html>
