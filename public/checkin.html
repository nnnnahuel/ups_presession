<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UP.S Check-in</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #09090b;
        color: #f4f4f5;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 760px;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #a1a1aa;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 34px;
        line-height: 1.05;
      }

      .muted {
        color: #a1a1aa;
        margin-bottom: 18px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
        transition: .18s ease;
      }

      .primary {
        background: #f4f4f5;
        color: #09090b;
      }

      .primary:hover {
        background: #e4e4e7;
      }

      .secondary {
        background: #27272a;
        color: #f4f4f5;
      }

      .secondary:hover {
        background: #323238;
      }

      .reader-wrap {
        background: #09090b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 14px;
      }

      #reader {
        width: 100%;
      }

      .status {
        margin-top: 16px;
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #27272a;
        background: #09090b;
        font-size: 18px;
      }

      .ok {
        border-color: #14532d;
        background: #052e16;
        color: #dcfce7;
      }

      .warn {
        border-color: #854d0e;
        background: #422006;
        color: #fde68a;
      }

      .err {
        border-color: #7f1d1d;
        background: #450a0a;
        color: #fecaca;
      }

      .manual {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #27272a;
      }

      .manual label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #d4d4d8;
      }

      .manual-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .manual input {
        width: 100%;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: #f4f4f5;
        border-radius: 12px;
        padding: 14px;
      }

      .tiny {
        margin-top: 8px;
        font-size: 12px;
        color: #a1a1aa;
      }

      @media (max-width: 640px) {
        .manual-row {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 28px;
        }

        .status {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="eyebrow">UP.S</div>
        <h1>Check-in</h1>
        <div class="muted">Escaneá tu QR al entrar.</div>

        <div class="actions">
          <button class="primary" id="startBtn">Iniciar cámara</button>
          <button class="secondary" id="stopBtn">Detener cámara</button>
        </div>

        <div class="reader-wrap">
          <div id="reader"></div>
        </div>

        <div id="status" class="status">Listo para escanear.</div>

        <div class="manual">
          <label for="manualQr">Ingreso manual</label>
          <div class="manual-row">
            <input id="manualQr" placeholder="Pegar código manual" />
            <button class="secondary" id="manualBtn">Registrar</button>
          </div>
          <div class="tiny">Útil si la cámara falla o para hacer pruebas rápidas.</div>
        </div>
      </div>
    </div>

    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytLPt2OIOJwhtbNISzjnxzcbtLfSMfR7PgLg7HgZEarzFOriYNyCLKUuk2QHESQ-uxJQ/exec";

      let scanner = null;
      let isSaving = false;
      let cooldownUntil = 0;
      let lastText = "";
      let activeJsonpScript = null;

      const statusEl = document.getElementById("status");
      const manualQrEl = document.getElementById("manualQr");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const manualBtn = document.getElementById("manualBtn");

      function setStatus(message, type = "") {
        statusEl.className = "status";
        if (type) statusEl.classList.add(type);
        statusEl.textContent = message;
      }

      function beepSuccess() {
        try {
          const context = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = context.createOscillator();
          const gainNode = context.createGain();

          oscillator.type = "sine";
          oscillator.frequency.value = 880;
          gainNode.gain.value = 0.08;

          oscillator.connect(gainNode);
          gainNode.connect(context.destination);

          oscillator.start();
          oscillator.stop(context.currentTime + 0.12);
        } catch (_) {}
      }

      function jsonp(url) {
        return new Promise((resolve, reject) => {
          const callbackName = "upsCheckinCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

          window[callbackName] = function (data) {
            cleanup();
            resolve(data);
          };

          function cleanup() {
            if (activeJsonpScript && activeJsonpScript.parentNode) {
              activeJsonpScript.parentNode.removeChild(activeJsonpScript);
            }
            activeJsonpScript = null;
            try {
              delete window[callbackName];
            } catch (_) {
              window[callbackName] = undefined;
            }
          }

          const script = document.createElement("script");
          const separator = url.includes("?") ? "&" : "?";
          script.src = `${url}${separator}callback=${callbackName}`;
          script.async = true;

          script.onerror = function () {
            cleanup();
            reject(new Error("No pude conectar con Apps Script."));
          };

          activeJsonpScript = script;
          document.body.appendChild(script);

          setTimeout(() => {
            if (window[callbackName]) {
              cleanup();
              reject(new Error("La API tardó demasiado en responder."));
            }
          }, 10000);
        });
      }

      async function saveCheckin(qrText) {
        const cleaned = String(qrText || "").trim();

        if (!cleaned) {
          setStatus("Código vacío.", "warn");
          return;
        }

        if (isSaving) return;

        const now = Date.now();
        if (cleaned === lastText && now < cooldownUntil) return;

        isSaving = true;
        lastText = cleaned;
        cooldownUntil = now + 1800;

        setStatus("Registrando...", "");

        try {
          const url =
            APPS_SCRIPT_URL +
            "?action=register&qrText=" +
            encodeURIComponent(cleaned);

          const res = await jsonp(url);

          if (!res.ok && !res.found) {
            setStatus(res.message || "No se pudo registrar.", "err");
          } else if (res.duplicate) {
            setStatus(res.message || "Ya registrado.", "warn");
            beepSuccess();
          } else {
            setStatus(res.message || "Check-in registrado.", "ok");
            beepSuccess();
          }

          manualQrEl.value = "";
        } catch (error) {
          setStatus("Error al registrar: " + error.message, "err");
        } finally {
          isSaving = false;
        }
      }
  async function startScanner() {
        try {
            if (scanner) {
                try { await scanner.stop(); } catch (_) { }
                try { await scanner.clear(); } catch (_) { }
            }

            const cameras = await Html5Qrcode.getCameras();
            if (!cameras || cameras.length === 0) {
                throw new Error("No se encontraron cámaras.");
            }

            // En notebook normalmente va a ser la webcam.
            // Si hay más de una, usa la primera por ahora.
            const cameraId = cameras[0].id;

            scanner = new Html5Qrcode(
                "reader",
                {
                    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
                }
            );

            const config = {
                fps: 12,
                qrbox: { width: 320, height: 320 },
                aspectRatio: 1.3333333,
                rememberLastUsedCamera: true
            };

            await scanner.start(
                cameraId,
                config,
                (decodedText) => {
                    console.log("QR detectado:", decodedText);
                    saveCheckin(decodedText);
                },
                (scanError) => {
                    // No lo mostramos en pantalla porque spamea,
                    // pero sí queda en consola para debug.
                    console.log("Scan error:", scanError);
                }
            );

            setStatus("Cámara activa. Acercá el QR y mantenelo quieto.", "");
        } catch (error) {
            console.error(error);
            setStatus("No pude iniciar la cámara o leer el QR.", "err");
        }
    }
      async function stopScanner() {
        try {
          if (scanner) {
            await scanner.stop();
            await scanner.clear();
            scanner = null;
          }
          setStatus("Cámara detenida.", "");
        } catch (_) {
          setStatus("No pude detener la cámara.", "err");
        }
      }

      startBtn.addEventListener("click", startScanner);
      stopBtn.addEventListener("click", stopScanner);

      manualBtn.addEventListener("click", () => {
        saveCheckin(manualQrEl.value);
      });

      manualQrEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          saveCheckin(manualQrEl.value);
        }
      });

      (async function pingApi() {
        try {
          const res = await jsonp(APPS_SCRIPT_URL + "?action=ping");
          if (res && res.ok) {
            setStatus("Listo para escanear.", "");
          } else {
            setStatus("La API respondió, pero no como esperaba.", "warn");
          }
        } catch (error) {
          setStatus("No pude conectar con Apps Script: " + error.message, "err");
        }
      })();
    </script>
  </body>
</html>
